<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Clipper - AI Style</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #3a2a81;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #0f172a;
            border-radius: 6px;
            border-left: 4px solid #38bdf8;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎬 YouTube Video Clipper</h2>
        <div class="form-group">
            <label for="videoUrl">Link Video YouTube:</label>
            <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
        </div>
       <div class="form-group">
    <label>Waktu Mulai:</label>
    <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
            <input type="number" id="startMinute" placeholder="Menit" min="0" value="0" style="width: 100%; padding: 8px;">
        </div>
        <div style="flex: 1;">
            <input type="number" id="startSecond" placeholder="Detik" min="0" max="59" value="0" style="width: 100%; padding: 8px;">
        </div>
    </div>
</div>

<div class="form-group" style="margin-top: 15px;">
    <label>Durasi Klip (Detik):</label>
    <input type="number" id="duration" min="1" value="30" style="width: 100%; padding: 8px;">
</div>

<button onclick="processClip()" style="margin-top: 20px; width: 100%; padding: 10px;">Buat Klip Sekarang</button>

    <script>
        
  async function processClip() {
    try {
        // Ambil nilai dari input menit dan detik
        const startMinute = parseInt(document.getElementById('startMinute').value) || 0;
        const startSecond = parseInt(document.getElementById('startSecond').value) || 0;
        const startTime = (startMinute * 60) + startSecond; // Konversi ke total detik

        const duration = parseInt(document.getElementById('duration').value) || 30;
        const endTime = startTime + duration;
        const videoUrl = document.getElementById('videoUrl').value;

       // Ganti URL ini dengan URL Localtunnel terbarumu
const response = await fetch('https://young-moose-camp.loca.lt/api/cut', {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json',
            'Bypass-Tunnel-Reminder': 'true'
        },
        body: JSON.stringify({ videoUrl, startTime, endTime })
    });

        if (!response.ok) {
            throw new Error('Gagal memproses video dari server.');
        }

        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = 'clip-hasil.mp4';
        document.body.appendChild(a);
        a.click();
        a.remove();

    } catch (error) {
        console.error(error);
        alert('Terjadi kesalahan saat memotong video!');
    }
}
  
</script>

</body>
</html>
